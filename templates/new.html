<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Entry</title>
  <style>
    html, body, input, textarea, select, button, label, h1 {
      font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', Arial, sans-serif;
    }
    body { background: #f0fff0; padding: 2rem; }
    form { background: #fff; padding: 1rem; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 5px #ccc; }
    label { display: block; margin-top: 1rem; }
    input, textarea {
      width: 96%;
      padding: 0.5rem;
      margin-right: 1rem;
      border-radius: 12px;
      border: 2px solid #333;
      background: #fafafa;
      color: #222;
    }
    button { margin-top: 1rem; padding: 0.5rem 1rem; background: #4caf50; color: #fff; border: none; border-radius: 4px; }
    input, select, textarea {
      font-size: 1.3em;
      padding: 0.5em;
      margin-bottom: 1em;
    }
    label {
      font-size: 1.1em;
    }
    button, input[type=submit] {
      font-size: 1.2em;
      padding: 0.5em 1.2em;
    }
  </style>
</head>
<body>
  <h1>📝 New Entry</h1>
  <a href="/" style="display:inline-block;margin-bottom:1rem;color:#4caf50;text-decoration:underline;">← Back</a>
  <form method="POST">
    <label>Mood:</label>
    <select name="mood" required>
      <option value="">Select your mood...</option>
      {% for mood in moods %}
        <option>{{ mood }}</option>
      {% endfor %}
    </select>

    <label>Gratitude:</label>
    <input type="text" name="gratitude" required placeholder="Today I am grateful to my mom, weather, cat..." id="gratitude-input" />

    <label>Reflection:</label>
    <textarea name="reflection" rows="4" required placeholder="It was so sunny today that I just had to buy me some Boba tea..." id="reflection-input"></textarea>

    <button type="submit">Save Entry</button>
  </form>
  <script>
    function handlePlaceholder(id, placeholderText) {
      const el = document.getElementById(id);
      el.addEventListener('focus', function() {
        this.setAttribute('data-placeholder', this.getAttribute('placeholder'));
        this.setAttribute('placeholder', '');
      });
      el.addEventListener('blur', function() {
        this.setAttribute('placeholder', this.getAttribute('data-placeholder'));
      });
    }
    handlePlaceholder('gratitude-input', 'Today I am grateful to my mom, weather, cat...');
    handlePlaceholder('reflection-input', 'It was so sunny today that I just had to buy me some Boba tea...');
  </script>
</body>
</html>
